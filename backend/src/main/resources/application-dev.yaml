# 개발용(호스트에서 ./gradlew bootRun --args='--spring.profiles.active=dev').
# architecture.md §4.3: 개발용 Spring Boot는 127.0.0.1:8080에만 바인딩한다.
server:
  address: 127.0.0.1
  port: 8080

jaystudio:
  # dev 프로필은 Vite(5173)에서 오는 요청도 허용한다(architecture.md §4.2).
  allowed-origins: ${JAYSTUDIO_ALLOWED_ORIGINS:http://127.0.0.1:5173}
