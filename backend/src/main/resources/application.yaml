spring:
  application:
    name: jaystudio
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  datasource:
    url: jdbc:sqlite:${jaystudio.data-path}/events.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite는 쓰기 주체가 하나여야 한다(architecture.md §6.5).
      maximum-pool-size: 1

server:
  error:
    include-stacktrace: never
    include-message: never
  # 컨테이너 안 프로세스는 컨테이너 네임스페이스 인터페이스에 바인딩한다(server.address 미지정, ADR-05).
  # 호스트 노출은 compose.yaml의 `127.0.0.1:` 접두로만 결정된다.
  port: 4180

debug: false

logging:
  level:
    root: INFO

# 필수: JAYSTUDIO_HOST_PATH, JAYSTUDIO_PUBLIC_PORT — 없거나 빈 값이면 AppProperties가 기동을 실패시킨다.
jaystudio:
  host-path: ${JAYSTUDIO_HOST_PATH:}
  public-port: ${JAYSTUDIO_PUBLIC_PORT:}
  mount-path: ${JAYSTUDIO_MOUNT_PATH:/workspace}
  data-path: ${JAYSTUDIO_DATA_PATH:/data}
  helper-url: ${JAYSTUDIO_HELPER_URL:http://127.0.0.1:4181}
  # 비어 있으면 OriginFilter가 http://127.0.0.1:<public-port>를 기본값으로 계산한다(architecture.md §4.2·§5).
  # dev 프로필(application-dev.yaml)은 이 값을 5173으로 완전히 대체한다.
  allowed-origins: ${JAYSTUDIO_ALLOWED_ORIGINS:}
