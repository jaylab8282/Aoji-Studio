spring:
  application:
    name: aojistudio
  sql:
    init:
      # DataSource는 spring.datasource.*가 아니라 studio.aoji.config.SqliteConfig가 직접 만든다
      # (aojistudio.data-path 기준, 기동 시 손상 파일 복구 포함, architecture.md §6.5·§9). 이 설정은
      # 그 빈을 대상으로 schema.sql만 적용한다.
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false

server:
  error:
    include-stacktrace: never
    include-message: never
  # 컨테이너 안 프로세스는 컨테이너 네임스페이스 인터페이스에 바인딩한다(server.address 미지정, ADR-05).
  # 호스트 노출은 compose.yaml의 `127.0.0.1:` 접두로만 결정된다.
  port: 4180

debug: false

logging:
  level:
    root: INFO

# 필수: AOJISTUDIO_HOST_PATH, AOJISTUDIO_PUBLIC_PORT — 없거나 빈 값이면 AppProperties가 기동을 실패시킨다.
# 환경 변수(새 이름 우선, 옛 이름 수용)는 legacy.LegacyEnvironmentPostProcessor가 해석해 aojistudio.* 로 넣는다(ADR-56).
# 여기에는 환경 변수가 없을 때의 기본값만 둔다.
aojistudio:
  host-path:
  public-port:
  mount-path: /workspace
  data-path: /data
  helper-url: http://127.0.0.1:4181
  # 비어 있으면 OriginFilter가 http://127.0.0.1:<public-port>를 기본값으로 계산한다(architecture.md §4.2·§5).
  # dev 프로필(application-dev.yaml)은 이 값을 5173으로 완전히 대체한다.
  allowed-origins:
