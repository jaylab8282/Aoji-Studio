openapi: 3.1.0
info:
  title: Jay Studio API
  version: "1.0.0"
  description: |
    Frontend–Server 계약. 모든 경로는 컨테이너 `http://127.0.0.1:4180` (개발 `http://127.0.0.1:8080`) 기준.
    - `/api/**`: 브라우저용. Origin 규칙(architecture.md §5) 필수. 변경 요청은 `X-JayStudio-Browser-Token` 헤더 필수.
    - `/hooks/events`: Claude Code hook 수집. `X-JayStudio-Collect-Token` 필수. Origin 규칙 없음.
    - `/api/stream`: SSE. 메시지 스키마는 `realtime-spec.md`. 이 문서의 `Snapshot`·`Registry`·`Live`·`EventRow`를 그대로 쓴다.
    - 시각은 모두 ISO-8601 offset 포함 문자열(예: `2026-09-20T13:45:12.345+09:00`). 화면 표기는 프론트가 로컬 시각으로 변환한다.
    - 에러 본문은 항상 `ApiError`. 필드별 사유는 `fields`.
    - 워크플로우 이름은 경로에 percent-encoding 한다(한글 허용).

servers:
  - url: http://127.0.0.1:4180
    description: 컨테이너
  - url: http://127.0.0.1:8080
    description: 개발 (dev 프로필)

tags:
  - name: auth
  - name: state
  - name: events
  - name: agents
  - name: workflows
  - name: registry
  - name: settings
  - name: helper
  - name: collect

paths:
  /api/auth/browser-token:
    get:
      tags: [auth]
      summary: 브라우저 토큰 발급 (ADR-01)
      description: Origin 규칙만 검사한다. 서버 수명 동안 같은 값을 돌려준다.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string, minLength: 64, maxLength: 64, description: hex 64자 }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/state:
    get:
      tags: [state]
      summary: 전체 스냅샷 (첫 화면·재연결 보조)
      description: SSE `snapshot` 메시지와 같은 본문. FR-001-AC4·NFR-02 목록 API 1초 기준의 측정 대상.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/events:
    get:
      tags: [events]
      summary: 실시간 이벤트 최신순
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EventRow" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/agents/{name}/events:
    get:
      tags: [events]
      summary: 특정 에이전트의 최근 이벤트 (03 패널, FR-007-AC6)
      description: `agent_type == name`인 이벤트. 서브에이전트로 실행된 이벤트도 포함.
      parameters:
        - $ref: "#/components/parameters/AgentName"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EventRow" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/agents:
    post:
      tags: [agents]
      summary: 에이전트 만들기 (06, FR-010)
      security: [{ browserToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentCreateRequest" }
      responses:
        "201":
          description: 정의 파일과 구성 파일 모두 반영됨(FR-010-AC7)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "400":
          description: |
            `VALIDATION` — fields 예: `name`: `소문자·숫자·하이픈만, 1~64자` / `이미 있는 name입니다` / `description`: `필수` / `workflow`: `필수` / `tools`: `직접 선택은 1개 이상` / `model`: `허용하지 않는 값` (FR-010-E1)
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: "`FORBIDDEN_ORIGIN` | `UNAUTHORIZED_TOKEN` | `READ_ONLY`(FR-010-E2)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: "`WORKFLOW_NOT_FOUND`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "409":
          description: "`LEAD_EXISTS` — 대상 워크플로우에 팀장이 이미 있음(FR-010-AC4 서버 판정)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "500":
          description: "`IO_FAILED` — 쓰기 실패. 만든 파일은 되돌림(FR-010-E3)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /api/agents/{name}:
    get:
      tags: [agents]
      summary: 정의 파일 상세 (06 수정 폼 채우기)
      parameters: [ { $ref: "#/components/parameters/AgentName" } ]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }
        "404":
          description: "`AGENT_NOT_FOUND`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "409":
          description: "`UNEDITABLE` — 형식 오류 파일(FR-011-E3). `fields.file`에 파일명, `message`에 사유"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    put:
      tags: [agents]
      summary: 에이전트 수정 (06, FR-011)
      security: [{ browserToken: [] }]
      parameters: [ { $ref: "#/components/parameters/AgentName" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentUpdateRequest" }
      responses:
        "200":
          description: 저장됨. `name`이 바뀌었으면 응답 `name`이 새 값.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDetail" }
        "400":
          description: "`VALIDATION` (FR-011-E2 새 name 중복은 `fields.name: 이미 있는 name입니다`)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: "`FORBIDDEN_ORIGIN` | `UNAUTHORIZED_TOKEN` | `READ_ONLY`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: "`AGENT_NOT_FOUND` | `WORKFLOW_NOT_FOUND`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "409":
          description: |
            - `REVISION_CONFLICT` — `expectedRevision` ≠ 현재(FR-011-AC4). `details.currentRevision`, `details.modifiedAt`. 프론트는 06-5를 띄우고 `force: true`로 재요청하거나 GET으로 다시 채운다.
            - `AGENT_BUSY` — 상태가 running/waiting(FR-011-E4). message `작업 중에는 수정할 수 없습니다 · 대기가 되면 다시 시도하세요`
            - `FILE_GONE` — 저장 중 파일 사라짐(FR-011-E1)
            - `LEAD_EXISTS` — 대상 워크플로우에 다른 팀장이 있음
            - `UNEDITABLE` — 형식 오류 파일(FR-011-E3)
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "500":
          description: "`IO_FAILED` — 되돌림 후 사유(FR-011-AC6)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    delete:
      tags: [agents]
      summary: 워크플로우에서 제거 = 휴지통 이동 (06-6, FR-012)
      description: 정의 파일을 `.jaystudio/trash/<name>.<yyyyMMdd-HHmmss>.md`로 옮기고 소속 구성 파일에서 뺀다. 워크플로우 밖 에이전트도 허용(FR-012-AC5).
      security: [{ browserToken: [] }]
      parameters: [ { $ref: "#/components/parameters/AgentName" } ]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [trashPath, removedFromWorkflow]
                properties:
                  trashPath: { type: string, example: ".jaystudio/trash/architect.20260920-134512.md" }
                  removedFromWorkflow: { type: [string, "null"], description: 빠진 워크플로우 이름 }
        "403":
          description: "`FORBIDDEN_ORIGIN` | `UNAUTHORIZED_TOKEN` | `READ_ONLY`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: "`AGENT_NOT_FOUND`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "409":
          description: "`AGENT_BUSY` — FR-012-E2. message `작업 중에는 제거할 수 없습니다`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "500":
          description: "`IO_FAILED` — 정의·구성 파일 모두 원래대로(FR-012-E1)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /api/workflows:
    post:
      tags: [workflows]
      summary: 워크플로우 추가 (05 왼쪽, FR-008)
      security: [{ browserToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "trim 후 1~40자, `^[가-힣A-Za-z0-9 _-]+$`" }
                description: { type: string, default: "" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "400":
          description: "`VALIDATION` — `fields.name`: `이미 있는 이름입니다`(FR-008-E1) / `1~40자, 한글·영문·숫자·공백·하이픈·언더스코어만`(FR-008-E2)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: "`FORBIDDEN_ORIGIN` | `UNAUTHORIZED_TOKEN` | `READ_ONLY`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "500":
          description: "`IO_FAILED` — 파일 만들지 않음(FR-008-E3)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /api/workflows/{workflow}:
    delete:
      tags: [workflows]
      summary: 워크플로우 삭제 (05-3, FR-017)
      description: 팀장·팀원(원본 기준)이 0명일 때만. 구성 파일을 삭제한다(휴지통 없음).
      security: [{ browserToken: [] }]
      parameters: [ { $ref: "#/components/parameters/WorkflowName" } ]
      responses:
        "204": { description: 삭제됨 }
        "403":
          description: "`FORBIDDEN_ORIGIN` | `UNAUTHORIZED_TOKEN` | `READ_ONLY`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: "`WORKFLOW_NOT_FOUND`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "409":
          description: "`WORKFLOW_NOT_EMPTY` — message `팀원이 있어 삭제할 수 없습니다`(FR-017-E1)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "500":
          description: "`IO_FAILED` — 구성 파일 유지(FR-017-E2)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /api/workflows/{workflow}/members:
    post:
      tags: [workflows]
      summary: 기존 에이전트 가져오기 (05 오른쪽, FR-009)
      description: 정의 파일은 바꾸지 않는다(FR-009-AC3). 부분 성공을 허용한다(FR-009-E2).
      security: [{ browserToken: [] }]
      parameters: [ { $ref: "#/components/parameters/WorkflowName" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, role]
                    properties:
                      name: { type: string }
                      role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: 하나 이상 저장됨. `rejected`가 비어 있지 않으면 프론트가 사유를 표시하고 목록을 갱신한다.
          content:
            application/json:
              schema:
                type: object
                required: [added, rejected, workflow]
                properties:
                  added: { type: array, items: { type: string } }
                  rejected:
                    type: array
                    items:
                      type: object
                      required: [name, reason]
                      properties:
                        name: { type: string }
                        reason:
                          type: string
                          enum: [ALREADY_ASSIGNED, NOT_FOUND, FORMAT_ERROR]
                          description: "ALREADY_ASSIGNED = 가져오는 사이 다른 워크플로우에 소속됨(FR-009-E2)"
                  workflow: { $ref: "#/components/schemas/Workflow" }
        "400":
          description: "`VALIDATION` — `LEAD_MULTIPLE`(팀장 2명 이상 선택, FR-009-E1)은 `fields.members: 팀장은 1명만 선택할 수 있습니다`, 빈 목록"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: "`FORBIDDEN_ORIGIN` | `UNAUTHORIZED_TOKEN` | `READ_ONLY`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: "`WORKFLOW_NOT_FOUND`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "409":
          description: "`LEAD_EXISTS` — 워크플로우에 팀장이 이미 있는데 `lead` 역할 포함(FR-009-AC4 서버 판정). 전체 거부"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "500":
          description: "`IO_FAILED` — 구성 파일 변경 없음(FR-009-E3)"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /api/registry/rescan:
    post:
      tags: [registry]
      summary: 다시 읽기 (07·04-5, FR-001-AC4)
      description: 즉시 재스캔하고 새 Registry를 돌려준다. SSE로도 `registry`를 방송한다. 1초 이내 응답.
      security: [{ browserToken: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registry" }
        "403":
          description: "`FORBIDDEN_ORIGIN` | `UNAUTHORIZED_TOKEN`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /api/settings:
    get:
      tags: [settings]
      summary: 07 설정 값 (FR-014)
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /api/helper/token:
    get:
      tags: [helper]
      summary: 도우미 토큰 전달 (FR-013-AC8)
      description: Origin 규칙 + 브라우저 토큰. `.jaystudio/helper-token`을 읽는다. 없으면 `token: null`(도우미 미설치로 표시).
      security: [{ browserToken: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: [string, "null"] }
        "403":
          description: "`FORBIDDEN_ORIGIN` | `UNAUTHORIZED_TOKEN`"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /api/stream:
    get:
      tags: [state]
      summary: SSE 실시간 스트림 (realtime-spec.md)
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: 브라우저 토큰(EventSource는 헤더를 못 붙인다)
      responses:
        "200":
          description: "`text/event-stream`. 접속 직후 `snapshot` 1건, 이후 `registry`/`live`/`event`/`heartbeat`"
          content:
            text/event-stream:
              schema: { type: string }
        "403": { $ref: "#/components/responses/ForbiddenOrigin" }

  /hooks/events:
    post:
      tags: [collect]
      summary: Claude Code hook 수집 (FR-003)
      description: |
        - 헤더 `Content-Type: application/json`, `X-JayStudio-Collect-Token` 필수.
        - 유효한 요청은 항상 `204` 빈 본문(FR-003-AC3). 사용하지 않는 이벤트·JSON 파싱 실패·`hook_event_name` 누락도 `204`이며 저장하지 않는다(FR-003-E1).
        - 100ms 이내 응답. 저장(INSERT)과 상태 전이는 요청 스레드에서, SSE 방송은 비동기.
      security: [{ collectToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HookPayload" }
      responses:
        "204": { description: 받음(저장 여부와 무관) }
        "401": { description: 토큰 없음·불일치. 본문 없음. 저장하지 않음(FR-003-AC2) }
        "415": { description: "`Content-Type`이 `application/json`이 아님. 저장하지 않음" }

  # ---------------------------------------------------------------------------
  # 열기 도우미 (맥북 호스트 127.0.0.1:4181). 브라우저가 직접 호출한다(FR-013-AC6).
  # 서버 경로가 아니므로 path-level servers로 구분한다. E2E는 JAYSTUDIO_HELPER_URL로 포트를 바꾼다(ADR-12).
  # ---------------------------------------------------------------------------
  /health:
    servers: [ { url: http://127.0.0.1:4181 } ]
    get:
      tags: [helper]
      summary: 도우미 설치·응답 확인 (FR-013-AC10)
      description: Origin 규칙(허용 목록)만 검사. 토큰 불필요. CORS 응답 헤더 포함.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [ok, version]
                properties:
                  ok: { type: boolean, const: true }
                  version: { type: string, example: "1" }
        "403": { description: Origin 불허. 본문 `{ code: "FORBIDDEN_ORIGIN", message }` }
  /open:
    servers: [ { url: http://127.0.0.1:4181 } ]
    options:
      tags: [helper]
      summary: CORS preflight
      responses:
        "204": { description: "허용 Origin이면 `Access-Control-Allow-Origin`=요청 Origin, `Allow-Methods: POST`, `Allow-Headers: Content-Type, X-JayStudio-Helper-Token`" }
        "403": { description: Origin 불허 }
    post:
      tags: [helper]
      summary: 맥북 기본 터미널에서 claude 실행 (FR-013)
      description: |
        요청 값은 `target`과 (lead일 때) `leadName`뿐이다. 경로·명령·옵션은 보내지 않는다(FR-013-AC6).
        실행 명령: default → `cd "<projectDir>" && claude` / lead → `cd "<projectDir>" && claude --agent <leadName>`.
        `--dry-run`이면 실행 대신 stdout에 `DRY-RUN <command>`를 쓰고 204.
      security: [{ helperToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [target]
                  properties:
                    target: { type: string, const: default }
                - type: object
                  required: [target, leadName]
                  properties:
                    target: { type: string, const: lead }
                    leadName: { type: string, pattern: "^[a-z0-9-]{1,64}$" }
      responses:
        "204": { description: 실행 요청됨 }
        "400": { description: "본문 형식 오류 또는 leadName 규칙 위반(FR-013-E3). `{ code: \"INVALID_NAME\" | \"INVALID_BODY\", message }`" }
        "403": { description: "Origin 또는 토큰 불일치(FR-013-E2). `{ code: \"FORBIDDEN_ORIGIN\" | \"UNAUTHORIZED_TOKEN\", message }`" }
        "415": { description: "`Content-Type`이 `application/json`이 아님" }
        "500": { description: "osascript 실행 실패. `{ code: \"OPEN_FAILED\", message }`" }

components:
  securitySchemes:
    helperToken:
      type: apiKey
      in: header
      name: X-JayStudio-Helper-Token
    browserToken:
      type: apiKey
      in: header
      name: X-JayStudio-Browser-Token
    collectToken:
      type: apiKey
      in: header
      name: X-JayStudio-Collect-Token

  parameters:
    AgentName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" }
    WorkflowName:
      name: workflow
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 40 }
      description: percent-encoded 워크플로우 이름

  responses:
    ForbiddenOrigin:
      description: >-
        `FORBIDDEN_ORIGIN` — Origin 규칙 실패.
        `message`는 서버가 `허용되지 않은 출처입니다 · <publicOrigin> 주소로 다시 접속하세요`로 완성해 보낸다(ADR-41,
        `<publicOrigin>` = `Config.publicOrigin` 값). 프론트는 `message`를 가공 없이 표시한다.
        신설 문구이므로 사용자 승인 전에는 구현하지 않는다(T-FIX-05).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
          example:
            code: FORBIDDEN_ORIGIN
            message: "허용되지 않은 출처입니다 · http://127.0.0.1:4180 주소로 다시 접속하세요"

  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION
            - FORBIDDEN_ORIGIN
            - UNAUTHORIZED_TOKEN
            - READ_ONLY
            - AGENT_NOT_FOUND
            - WORKFLOW_NOT_FOUND
            - UNEDITABLE
            - REVISION_CONFLICT
            - AGENT_BUSY
            - FILE_GONE
            - LEAD_EXISTS
            - WORKFLOW_NOT_EMPTY
            - IO_FAILED
        message: { type: string, description: 사용자에게 그대로 보여줄 한국어 문장 }
        fields:
          type: object
          additionalProperties: { type: string }
          description: 필드명 → 사유. 폼 필드 아래에 표시
        details:
          type: object
          additionalProperties: true
          description: "REVISION_CONFLICT: { currentRevision, modifiedAt }"

    Status:
      type: string
      enum: [running, waiting, idle]
      description: "작업 중 / 권한·입력 대기 / 대기"

    Role:
      type: string
      enum: [lead, member]

    Snapshot:
      type: object
      required: [serverTime, config, registry, live, recentEvents]
      properties:
        serverTime: { type: string, format: date-time }
        config: { $ref: "#/components/schemas/Config" }
        registry: { $ref: "#/components/schemas/Registry" }
        live: { $ref: "#/components/schemas/Live" }
        recentEvents:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/EventRow" }
          description: 최신순 50개(FR-005-AC6)

    Config:
      type: object
      required: [hostPath, publicOrigin, collectUrl, helperUrl, defaultSessionCommand]
      properties:
        hostPath: { type: string, example: "/Users/jaybee/Desktop/JayStudio", description: 맥북 경로(FR-014-AC4) }
        publicOrigin: { type: string, example: "http://127.0.0.1:4180", description: "확정 진입 주소. 프론트는 이 값으로 리다이렉트하지 않는다(ADR-41: 정규화는 호스트명만 본다)" }
        collectUrl: { type: string, example: "http://127.0.0.1:4180/hooks/events" }
        helperUrl: { type: string, example: "http://127.0.0.1:4181", description: ADR-12 }
        defaultSessionCommand: { type: string, example: "cd \"/Users/jaybee/Desktop/JayStudio\" && claude", description: FR-013-AC1 }

    Registry:
      type: object
      required: [revision, scannedAt, agentsDirMissing, writable, agentCount, skillCount, agents, workflows, formatErrors, hookConfigured]
      properties:
        revision: { type: integer, description: 스캔마다 증가 }
        scannedAt: { type: string, format: date-time }
        agentsDirMissing: { type: boolean, description: "`.claude/agents/` 없음 → 04-5 (FR-001-E1)" }
        writable: { type: boolean, description: "마운트 쓰기 가능 (FR-001-E2)" }
        agentCount: { type: [integer, "null"], description: "정상 정의 파일 수. agentsDirMissing이면 null" }
        skillCount: { type: integer, description: "`.claude/skills/*/SKILL.md` 폴더 수. 폴더 없으면 0 (FR-001-AC2·E3)" }
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentDef" }
          description: 정상 정의 파일만, name 오름차순
        workflows:
          type: array
          items: { $ref: "#/components/schemas/Workflow" }
          description: 정상 구성 파일만, name 오름차순
        formatErrors:
          type: array
          items: { $ref: "#/components/schemas/FormatError" }
          description: 04-6 목록
        hookConfigured: { type: boolean, description: FR-014-AC3 }

    AgentDef:
      type: object
      required: [name, description, filePath, workflow, role, duplicateWorkflows]
      properties:
        name: { type: string }
        description: { type: string, description: 없으면 빈 문자열(FR-002-AC4) }
        filePath: { type: string, example: ".claude/agents/architect.md", description: 마운트 루트 기준 상대 경로 }
        workflow: { type: [string, "null"], description: "소속 워크플로우. 중복 소속이면 이름 오름차순 첫 것(FR-006-AC11). 없으면 null = 워크플로우 밖" }
        role: { oneOf: [ { $ref: "#/components/schemas/Role" }, { type: "null" } ] }
        duplicateWorkflows:
          type: array
          items: { type: string }
          description: 두 구성 파일 이상에 있으면 모든 워크플로우 이름(오름차순). 아니면 빈 배열

    Workflow:
      type: object
      required: [name, description, filePath, lead, members, brokenRefs, rawMemberCount]
      properties:
        name: { type: string }
        description: { type: string }
        filePath: { type: string, example: ".jaystudio/teams/개발부서.json" }
        lead: { type: [string, "null"], description: 팀장 name. 깨진 참조면 null이고 brokenRefs에 포함 }
        members:
          type: array
          items: { type: string }
          description: 정상 참조 팀원 name, 오름차순. 깨진 참조 제외
        brokenRefs:
          type: array
          items: { type: string }
          description: 정의 파일이 없는 name(FR-002-AC5)
        rawMemberCount: { type: integer, description: "구성 파일 원본의 (lead?1:0)+members.length. FR-017-AC1 0명 판정 기준" }

    FormatError:
      type: object
      required: [kind, file, message]
      properties:
        kind:
          type: string
          enum: [agent, workflow, broken-ref]
        file: { type: string, description: "agent: `<파일명>.md` / workflow: `<파일명>.json` / broken-ref: name" }
        message:
          type: string
          description: |
            agent: `name 누락` | `name 형식 위반` | `frontmatter 형식 오류` | `name 중복 (<다른 파일>)` | `UTF-8 인코딩 오류` | `마운트 밖 링크`
            workflow: `구성 파일 형식 오류`
            broken-ref: `구성 파일 참조 깨짐 (<워크플로우>)`
        workflow: { type: string, description: broken-ref일 때 워크플로우 이름 }

    Live:
      type: object
      required: [lastReceivedAt, everReceived, agents, lobby, undefinedSubagents]
      properties:
        lastReceivedAt: { type: [string, "null"], format: date-time, description: "마지막 수신 시각 (FR-003-AC6). DB 기준이라 재시작 후에도 유지" }
        everReceived: { type: boolean, description: "이벤트 1건 이상 저장됨. false → 04-1 / 04-4" }
        agents:
          type: object
          additionalProperties: { $ref: "#/components/schemas/AgentLive" }
          description: "key = 정상 정의 파일 name. 이벤트 없는 에이전트도 포함(status idle)"
        lobby:
          type: array
          items: { $ref: "#/components/schemas/LobbyEntry" }
          description: "02 로비. `[세션 N]` 항목 먼저(N 오름차순), 그다음 워크플로우 밖 에이전트 name 오름차순"
        undefinedSubagents:
          type: array
          items: { $ref: "#/components/schemas/UndefinedSubagent" }

    AgentLive:
      type: object
      required: [name, status, currentTool, sessionStartedAt, childCount, cwd, parentLabel, lastEventAt, lastEvent]
      properties:
        name: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        currentTool:
          oneOf:
            - { $ref: "#/components/schemas/ToolRef" }
            - { type: "null" }
          description: "마지막 PreToolUse. idle이면 null (FR-007-AC5)"
        sessionStartedAt: { type: [string, "null"], format: date-time, description: 가장 최근 SessionStart/SubagentStart }
        childCount: { type: integer, description: 현재 실행 중인 서브에이전트 수 }
        cwd: { type: [string, "null"], description: 마지막 이벤트의 cwd }
        parentLabel: { type: [string, "null"], description: "서브에이전트로 실행 중이면 부모 라벨(`develop-tech-lead` 또는 `[세션 1]`). 상태 글자 뒤 `· 부모 <라벨>` (FR-007-AC3)" }
        lastEventAt: { type: [string, "null"], format: date-time }
        lastEvent:
          oneOf:
            - { $ref: "#/components/schemas/EventRow" }
            - { type: "null" }
          description: 이 에이전트의 마지막 이벤트(01 카드 최근 활동용, 재시작 후 DB에서 복원)

    ToolRef:
      type: object
      required: [name, target]
      properties:
        name: { type: string, example: Edit }
        target: { type: string, description: "마스킹된 대상 요약. 없으면 `-`" }

    LobbyEntry:
      type: object
      required: [kind, label, status, sessionId, currentTool]
      properties:
        kind:
          type: string
          enum: [session, agent]
          description: "session = agent_type 없는 메인 세션(FR-003-AC5) / agent = 워크플로우 밖 에이전트(FR-004-AC7)"
        label: { type: string, example: "[세션 1]", description: "session: `[세션 N]` / agent: name" }
        status: { $ref: "#/components/schemas/Status" }
        sessionId: { type: string }
        currentTool:
          oneOf:
            - { $ref: "#/components/schemas/ToolRef" }
            - { type: "null" }

    UndefinedSubagent:
      type: object
      required: [agentId, agentType, sessionId, status, currentTool, parentAgentName, parentLabel, startedAt]
      properties:
        agentId: { type: string }
        agentType: { type: string, example: Explore }
        sessionId: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        currentTool:
          oneOf:
            - { $ref: "#/components/schemas/ToolRef" }
            - { type: "null" }
        parentAgentName: { type: [string, "null"], description: "부모가 정의된 에이전트면 name. 03은 이 값이 그 워크플로우 소속일 때만 표시" }
        parentLabel: { type: string, description: "`develop-tech-lead` 또는 `[세션 1]`" }
        startedAt: { type: string, format: date-time }

    EventRow:
      type: object
      required: [id, at, hookEventName, kind, title, summary, sessionId, agentId, agentType, agentLabel, toolName]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time, description: 서버 수신 시각 }
        hookEventName:
          type: string
          enum: [SessionStart, SessionEnd, UserPromptSubmit, Stop, PreToolUse, PostToolUse, PostToolUseFailure, PermissionRequest, PermissionDenied, Notification, SubagentStart, SubagentStop]
        kind:
          type: string
          enum: [session-start, session-end, prompt, stop, tool, tool-done, tool-failure, permission, permission-denied, notification, subagent-start, subagent-stop]
        title:
          type: string
          description: |
            kind별 고정 문구: session-start `세션 시작` / session-end `세션 종료` / prompt `프롬프트 제출` / stop `응답 종료` /
            tool `도구 실행 · <tool>` / tool-done `도구 완료 · <tool>` / tool-failure `도구 실패 · <tool>` /
            permission `권한 요청 · <tool>` / permission-denied `권한 거부 · <tool>` / notification `알림 · <notification_type>` /
            subagent-start `서브에이전트 시작` / subagent-stop `서브에이전트 종료`
        summary:
          type: string
          maxLength: 200
          description: |
            FR-003-AC10 요약, 저장 전 마스킹(FR-015). session-start = cwd / tool·permission·tool-done·tool-failure·permission-denied = 대상(file_path → notebook_path → command → pattern → path → url → query → description 중 첫 값, 없으면 `-`) /
            subagent-start·stop = agent_type / session-end = reason / prompt·stop·notification = `-` (프롬프트·메시지 본문은 저장하지 않음)
        sessionId: { type: string }
        agentId: { type: [string, "null"] }
        agentType: { type: [string, "null"] }
        agentLabel: { type: string, description: "01 에이전트 열: agentType 또는 `[세션 N]`(서버 수명 내 라벨, 재시작 전 이벤트는 `[세션]`)" }
        toolName: { type: [string, "null"] }
        workflow: { type: [string, "null"], description: "읽는 시점의 소속 워크플로우(ADR-09). 로비·워크플로우 밖·정의 없음이면 null → 화면 `-` (FR-005-AC7)" }

    AgentDetail:
      type: object
      required: [name, description, model, tools, body, filePath, revision, modifiedAt, workflow, role, status, hasLiteralInheritModel]
      properties:
        name: { type: string }
        description: { type: string }
        model: { type: [string, "null"], description: frontmatter `model` 원본 값. 없으면 null }
        tools: { type: [array, "null"], items: { type: string }, description: "null = 전체 상속(생략)" }
        body: { type: string, description: 본문 원문(줄 끝 변환 없음) }
        filePath: { type: string }
        revision: { type: string, example: "1758343512345-1834", description: "`<mtimeMillis>-<size>`. 저장 시 expectedRevision으로 보냄" }
        modifiedAt: { type: string, format: date-time }
        workflow: { type: [string, "null"] }
        role: { oneOf: [ { $ref: "#/components/schemas/Role" }, { type: "null" } ] }
        status: { $ref: "#/components/schemas/Status" }
        hasLiteralInheritModel: { type: boolean, description: "원본에 `model: inherit` 줄이 있음(ADR-13 보존용)" }

    AgentCreateRequest:
      type: object
      required: [name, description, workflow, role, toolsMode]
      properties:
        name: { type: string, pattern: "^[a-z0-9-]{1,64}$" }
        description: { type: string, minLength: 1 }
        model: { type: [string, "null"], description: "null = 상속(지정 안 함, frontmatter 생략). 그 외 `sonnet`|`opus`|`haiku`|전체 모델 ID(`^[a-z0-9.-]{1,64}$`)" }
        workflow: { type: string, description: 필수(FR-010) }
        role: { $ref: "#/components/schemas/Role" }
        toolsMode: { type: string, enum: [inherit, explicit], description: "FR-010-AC2. inherit = frontmatter `tools` 생략" }
        tools: { type: array, items: { type: string, pattern: "^[A-Za-z0-9_()*,:. -]+$" }, description: "explicit일 때 1개 이상. 쉼표 구분 문자열로 저장" }
        body: { type: string, default: "" }

    AgentUpdateRequest:
      type: object
      required: [name, description, workflow, role, toolsMode, body, expectedRevision]
      properties:
        name: { type: string, pattern: "^[a-z0-9-]{1,64}$", description: 바뀌면 파일명·구성 파일 참조 변경(FR-011-AC2) }
        description: { type: string, minLength: 1 }
        model: { type: [string, "null"] }
        workflow: { type: [string, "null"], description: "null 허용은 원래 워크플로우 밖 에이전트일 때만(FR-011-AC3). 소속 에이전트는 필수" }
        role: { oneOf: [ { $ref: "#/components/schemas/Role" }, { type: "null" } ] }
        toolsMode: { type: string, enum: [inherit, explicit] }
        tools: { type: array, items: { type: string } }
        body: { type: string }
        expectedRevision: { type: string }
        force: { type: boolean, default: false, description: "06-5 `덮어쓰기`. true면 revision 검사 생략" }

    Settings:
      type: object
      required: [hostPath, agentCount, skillCount, writable, formatErrorCount, agentsDirMissing, terminalApp, defaultSessionCommand, leadSessionCommandTemplate, helperUrl, collectUrl, hookConfigured, hookSettingsExample, teamsPath, trashPath, retentionDays, allowedHttpHookUrlsNote]
      properties:
        hostPath: { type: string, example: "/Users/jaybee/Desktop/JayStudio", description: "맥북 경로(FR-014-AC4). 컨테이너 마운트 경로는 응답에 넣지 않는다(ADR-20)" }
        agentCount: { type: [integer, "null"] }
        skillCount: { type: integer }
        writable: { type: boolean }
        formatErrorCount: { type: integer }
        agentsDirMissing: { type: boolean }
        terminalApp: { type: string, const: "macOS 기본 터미널" }
        defaultSessionCommand: { type: string, example: "cd \"/Users/jaybee/Desktop/JayStudio\" && claude" }
        leadSessionCommandTemplate: { type: string, example: "cd \"/Users/jaybee/Desktop/JayStudio\" && claude --agent <팀장 name>", description: 07 표시용 템플릿(FR-013-AC5) }
        helperUrl: { type: string }
        collectUrl: { type: string }
        hookConfigured: { type: boolean }
        hookSettingsExample: { type: string, description: "FR-014-AC2 JSON 문자열(들여쓰기 2). 수집 토큰 포함. `설정 예시 복사`가 그대로 복사" }
        teamsPath: { type: string, const: ".jaystudio/teams/*.json" }
        trashPath: { type: string, const: ".jaystudio/trash/" }
        retentionDays: { type: integer, const: 30 }
        allowedHttpHookUrlsNote: { type: string, description: "사용자 설정에 `allowedHttpHookUrls`가 있으면 수집 주소를 넣어야 한다는 안내 문구" }

    HookPayload:
      type: object
      description: Claude Code http hook 입력. 알 수 없는 필드는 무시한다.
      required: [session_id, hook_event_name]
      properties:
        session_id: { type: string }
        cwd: { type: string }
        hook_event_name: { type: string }
        permission_mode: { type: string, description: "backend는 저장·사용하지 않음(`HookPayload.java` record에 없어 무시된다). 스키마에 남기는 이유는 Claude Code http hook이 실제로 보내는 공통 입력 필드이기 때문이다(FR-003-AC9, final_requirements_architecture.md 공통 입력 필드). ADR-50 C" }
        transcript_path: { type: string, description: 저장하지 않음 }
        agent_id: { type: string, description: 서브에이전트 안에서만 }
        agent_type: { type: string, description: "`--agent` 세션 또는 서브에이전트" }
        tool_name: { type: string }
        tool_input: { type: object, additionalProperties: true, description: 요약만 뽑고 원문은 저장하지 않음(FR-015-AC3) }
        notification_type: { type: string }
        message: { type: string, description: 저장하지 않음 }
        reason: { type: string, description: SessionEnd 사유. 요약에 저장 }
        source: { type: string, description: SessionStart 출처(startup|resume|clear|compact). 저장하지 않음 }
      additionalProperties: true
