# E2E 호환 배치 전용 compose (architecture.md §8.4.3, E2E_COMPOSE=legacy-env, E2E-R2-03).
# compose.e2e.yaml과 같고 환경 변수 이름만 옛 이름(JAYSTUDIO_*)이다. 볼륨 name: 고정 금지(D-109).
# E2E 전용 compose 오버레이 (architecture.md §8.1).
# 실행 전 반드시 fixture 폴더를 임시 폴더로 복사하고 E2E_FIXTURE_DIR로 지정한다.
# 실제 AojiStudio/.claude·.aojistudio는 절대 마운트하지 않는다(Automation Policy).
services:
  aojistudio-e2e:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: aojistudio:e2e
    platform: ${E2E_PLATFORM:-linux/arm64}
    user: "1000:1000"
    restart: "no"
    environment:
      TZ: Asia/Seoul
      JAYSTUDIO_HOST_PATH: ${E2E_FIXTURE_DIR:?E2E_FIXTURE_DIR(mktemp -d로 만든 fixture 임시 폴더)를 지정하세요}
      JAYSTUDIO_PUBLIC_PORT: "4185"
      JAYSTUDIO_MOUNT_PATH: /workspace
      JAYSTUDIO_DATA_PATH: /data
      JAYSTUDIO_HELPER_URL: http://127.0.0.1:4191
      JAYSTUDIO_ALLOWED_ORIGINS: http://127.0.0.1:4185
    ports:
      - "127.0.0.1:4185:4180"
    volumes:
      - ${E2E_FIXTURE_DIR:?E2E_FIXTURE_DIR를 지정하세요}:/workspace:${E2E_MOUNT_MODE:-rw}
      - aojistudio-e2e-data:/data

# 볼륨에 name:을 고정하지 않는다 — down -v가 -p 접두 볼륨만 지우게 한다(D-109).
volumes:
  aojistudio-e2e-data:
